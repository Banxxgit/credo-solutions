    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!--
      Perf note (next pass): on a cold load the Geist swap re-wraps the home
      headline, shifting the hero ~92px (CLS up to ~0.11; ~0.03 when the font is
      cached). Fix with a size-adjusted local fallback (@font-face with
      size-adjust / ascent-override matched to Geist) and/or self-hosting +
      preloading the Geist woff2 instead of display=swap via Google Fonts.
    -->
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300..600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
    <title>Credo Solutions | Technology & Product Engineering</title>
    <script>
      // Apply the saved (or system) motion preference before first paint.
      (function () {
        var pref = null;
        try { pref = localStorage.getItem('credo-motion'); } catch (e) {}
        if (pref !== 'reduce' && pref !== 'full') {
          pref = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 'reduce' : 'full';
        }
        document.documentElement.setAttribute('data-motion', pref);
      })();
    </script>
  </head>
  <body>

<form
  name="contact"
  method="POST"
  data-netlify="true"
  netlify-honeypot="bot-field"
  hidden
>

  <input type="text" name="name" />
  <input type="email" name="email" />
  <input type="text" name="company" />
  <textarea name="message"></textarea>
</form>
<form
  name="newsletter"

>

</form>
